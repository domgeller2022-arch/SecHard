# Reviewed third-party sources whose material this repository links, adapts, or reuses.
#
# Fields follow schemas/source.schema.json. A `planned` entry is a selection intent, never a verified
# selection. Preserve each component's own licence and notice with the material actually reused; a
# repository-wide licence does not cover imported text.
#
# `reviewed_release.kind: digest` entries record digests supplied by a review of a local snapshot
# that is not present in this repository. They identify the reviewed files, and they were not
# independently recomputed here. Verify the intended upstream release or commit before distributing
# adapted material.
# Upstream sources this repository links, cites, or reuses.
#
# Blueprint section 3 lists two families: standards (used for requirements and risk taxonomies) and
# tools/reference projects (candidates for the toolchain). Both are recorded here so that every
# external claim this repository makes has a source, an edition, and a licence behind it.
#
# Support status:
#   verified     the edition and licence were checked against the source on the date recorded
#   planned      selected for a later step, or a blueprint candidate not adopted in v1
#   unsupported  deliberately out of v1 scope
#
# `use_type` follows the plan: linking (cited by URL), invoking (run by the toolchain), adapting
# (wording or examples rewritten from it).
schema: hardening/sources/v1
