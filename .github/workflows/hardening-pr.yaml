# Callable pull-request evaluation for a consuming application repository.
#
# Trust boundary. This workflow runs on a pull request, which is untrusted input. It therefore:
#   - gives every job `contents: read` and nothing else;
#   - never uses `pull_request_target`, so a fork pull request cannot reach a privileged context;
#   - checks out the reviewed hardening tooling at an explicit commit rather than using the pull
#     request's copy of anything, so a pull request cannot weaken the checks that assess it;
#   - never masks a gate failure. Every step that can fail the job runs without `|| echo` or
#     `continue-on-error`, and the final `hardening-gate` job re-runs the gate against the uploaded
#     plan and results rather than trusting a green dependency job.
#
# `hardening_ref` must be the same reviewed commit the consumer's `.hardening/policy-lock.json`
# names. The CLI compares the two and refuses to plan when they disagree, so a caller that pins a
# different ref gets an error rather than a weaker evaluation.
name: hardening-pr

on:
  workflow_call:
    inputs:
      hardening_ref:
        description: Reviewed hardening commit SHA. Must match .hardening/policy-lock.json.
        required: true
        type: string
      app_root:
        description: Path to the application checkout within this repository.
        required: false
        type: string
        default: '.'
      environment:
        description: Environment to evaluate for.
        required: false
        type: string
        default: local

permissions: {}

jobs:
  hardening-pr:
    name: hardening-pr
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout application (untrusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false

      - name: checkout base-branch records (trusted)
        # The evaluation records come from the base branch, not from the pull request. A PR that
        # turns a feature off, adds an exception, or adds a manual attestation is then judged against
        # the records a reviewer has already accepted, instead of weakening its own assessment.
        if: github.event.pull_request.base.sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: app-base
          persist-credentials: false

      - name: checkout reviewed hardening tooling (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: domgeller2022-arch/SecHard
          ref: ${{ inputs.hardening_ref }}
          path: hardening
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      # `--filter sechard` installs only this tool's own dependencies. Without it, the example
      # workspace member drags Next.js, Playwright, and the Supabase CLI into the consumer's job.
      - name: install hardening tooling
        working-directory: hardening
        run: |
          pnpm install --frozen-lockfile --filter sechard
          pnpm run build

      # Step 13.7. A changed record set is a review-required event, not something the PR evaluates for
      # itself: the diff is printed, the job fails so a human must look, and the evaluation below runs
      # against the base records either way. The first adoption has no base records; that bootstrap
      # path is allowed and stated in docs/ci-trust.md.
      - name: use the base-branch records, and require review when they changed
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
          BASE_ROOT: ${{ github.workspace }}/app-base/${{ inputs.app_root }}
        run: |
          set -eu
          APP_RECORDS="$APP_ROOT/.hardening"
          BASE_RECORDS="$BASE_ROOT/.hardening"
          if [ ! -d "$BASE_RECORDS" ]; then
            echo "hardening-pr: no base-branch records (first adoption, or a non-PR event); evaluating the proposed records"
            exit 0
          fi
          changed=0
          if ! diff -qr "$BASE_RECORDS" "$APP_RECORDS"; then changed=1; fi
          rm -rf "$APP_RECORDS"
          cp -r "$BASE_RECORDS" "$APP_RECORDS"
          if [ "$changed" = "1" ]; then
            echo "hardening-pr: the pull request changes the evaluation records; a reviewer must accept the change. The evaluation used the base records."
            exit 1
          fi
          echo "hardening-pr: the base-branch records are unchanged and are what the evaluation used"

      - name: validate and plan
        working-directory: hardening
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -eu
          pnpm exec hardening validate --app "$APP_ROOT" --policy .
          pnpm exec hardening plan --app "$APP_ROOT" --policy . \
            --stage pr --environment "$ENVIRONMENT" --out "$RUNNER_TEMP/hardening-run"
          RUN_DIR="$(ls -d "$RUNNER_TEMP"/hardening-run/*/ | head -1)"
          echo "HARDENING_RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"

      # Required work that did not run makes `check` exit nonzero. That is deliberate: the job must
      # not be green when a required scanner is missing.
      - name: check
        working-directory: hardening
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
        run: |
          set -eu
          pnpm exec hardening check --app "$APP_ROOT" --policy . \
            --plan "${HARDENING_RUN_DIR}plan.json" --out "$HARDENING_RUN_DIR"

      # Report and gate always run so a blocked decision still produces the report a human reads.
      # Both steps propagate their exit code; the gate is what decides the job.
      - name: report
        if: always() && env.HARDENING_RUN_DIR != ''
        working-directory: hardening
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
        run: |
          set -eu
          pnpm exec hardening report --app "$APP_ROOT" --policy . --run "$HARDENING_RUN_DIR"

      - name: gate
        if: always() && env.HARDENING_RUN_DIR != ''
        working-directory: hardening
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
        run: |
          set -eu
          pnpm exec hardening gate --app "$APP_ROOT" --policy . --run "$HARDENING_RUN_DIR"

      - name: upload run artifacts
        if: always() && env.HARDENING_RUN_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hardening-pr-run
          path: |
            ${{ env.HARDENING_RUN_DIR }}plan.json
            ${{ env.HARDENING_RUN_DIR }}results.json
            ${{ env.HARDENING_RUN_DIR }}report.json
            ${{ env.HARDENING_RUN_DIR }}report.md
          retention-days: 14

  hardening-gate:
    name: hardening-gate
    if: always()
    needs: [hardening-pr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout application (untrusted)
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false

      - name: checkout reviewed hardening tooling (trusted)
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: domgeller2022-arch/SecHard
          ref: ${{ inputs.hardening_ref }}
          path: hardening
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: always()
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: always()
        with:
          node-version: 24.21.0


      - name: checkout base-branch records (trusted)
        if: always() && github.event.pull_request.base.sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: app-base
          persist-credentials: false

      - name: use the base-branch records for the recomputed gate
        if: always()
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
          BASE_ROOT: ${{ github.workspace }}/app-base/${{ inputs.app_root }}
        run: |
          set -eu
          APP_RECORDS="$APP_ROOT/.hardening"
          BASE_RECORDS="$BASE_ROOT/.hardening"
          if [ -d "$BASE_RECORDS" ] && [ ! -d "$APP_RECORDS" ]; then
            cp -r "$BASE_RECORDS" "$APP_RECORDS"
          fi

      - name: install hardening tooling
        if: always()
        working-directory: hardening
        run: |
          pnpm install --frozen-lockfile --filter sechard
          pnpm run build

      - name: download the run artifacts
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hardening-pr-run
          path: ${{ runner.temp }}/hardening-artifact

      # The gate job does not trust the dependency job's colour. It re-runs the gate with trusted
      # tooling against the uploaded plan and results, and the CLI recomputes the expected plan from
      # policy and the manifest. A missing artifact fails here.
      - name: re-run the gate against the uploaded evidence
        if: always()
        working-directory: hardening
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
        run: |
          set -eu
          RUN_DIR="$RUNNER_TEMP/hardening-artifact"
          if [ ! -f "$RUN_DIR/plan.json" ] || [ ! -f "$RUN_DIR/results.json" ]; then
            echo "hardening-gate: plan.json or results.json is missing from the artifact; refusing to report success"
            exit 1
          fi
          pnpm exec hardening gate --app "$APP_ROOT" --policy . --run "$RUN_DIR"
