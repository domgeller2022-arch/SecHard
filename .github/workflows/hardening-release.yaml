# Callable release evaluation for a consuming application repository.
#
# The same trust boundary as the pull-request workflow applies, plus the release stage's stricter
# requirements: a clean source identity, current manual evidence, and the production-scoped checks.
# The CLI enforces those; this file only arranges the checkout and the invocation.
#
# No step masks a failure: there is no `|| echo` and no `continue-on-error` anywhere. The final
# `hardening-gate` job re-runs the gate against the uploaded plan and results.
name: hardening-release

on:
  workflow_call:
    inputs:
      hardening_ref:
        description: Reviewed hardening commit SHA. Must match .hardening/policy-lock.json.
        required: true
        type: string
      app_root:
        description: Path to the application checkout within this repository.
        required: false
        type: string
        default: '.'
      environment:
        description: Environment to evaluate for. Release evaluation is production-scoped.
        required: false
        type: string
        default: production

permissions: {}

jobs:
  hardening-release:
    name: hardening-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout application (untrusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false

      - name: checkout reviewed hardening tooling (trusted)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: domgeller2022-arch/SecHard
          ref: ${{ inputs.hardening_ref }}
          path: hardening
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: install hardening tooling
        working-directory: hardening
        run: |
          pnpm install --frozen-lockfile --filter sechard
          pnpm run build

      - name: fetch pinned scanner tools
        working-directory: hardening
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run fetch:tools

      - name: validate and plan
        working-directory: hardening
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -eu
          pnpm exec hardening validate --app "$APP_ROOT" --policy .
          pnpm exec hardening plan --app "$APP_ROOT" --policy . \
            --stage release --environment "$ENVIRONMENT" --out "$RUNNER_TEMP/hardening-run"
          RUN_DIR="$(ls -d "$RUNNER_TEMP"/hardening-run/*/ | head -1)"
          echo "HARDENING_RUN_DIR=$RUN_DIR" >> "$GITHUB_ENV"

      - name: check
        working-directory: hardening
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
        run: |
          set -eu
          pnpm exec hardening check --app "$APP_ROOT" --policy . \
            --plan "${HARDENING_RUN_DIR}plan.json" --out "$HARDENING_RUN_DIR"

      - name: report
        if: always() && env.HARDENING_RUN_DIR != ''
        working-directory: hardening
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
        run: |
          set -eu
          pnpm exec hardening report --app "$APP_ROOT" --policy . --run "$HARDENING_RUN_DIR"

      - name: gate
        if: always() && env.HARDENING_RUN_DIR != ''
        working-directory: hardening
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
        run: |
          set -eu
          pnpm exec hardening gate --app "$APP_ROOT" --policy . --run "$HARDENING_RUN_DIR"

      - name: upload run artifacts
        if: always() && env.HARDENING_RUN_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hardening-release-run
          path: |
            ${{ env.HARDENING_RUN_DIR }}plan.json
            ${{ env.HARDENING_RUN_DIR }}results.json
            ${{ env.HARDENING_RUN_DIR }}report.json
            ${{ env.HARDENING_RUN_DIR }}report.md
          retention-days: 30

  hardening-gate:
    name: hardening-gate
    if: always()
    needs: [hardening-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout application (untrusted)
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          persist-credentials: false

      - name: checkout reviewed hardening tooling (trusted)
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: domgeller2022-arch/SecHard
          ref: ${{ inputs.hardening_ref }}
          path: hardening
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: always()
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: always()
        with:
          node-version: 24.21.0

      - name: install hardening tooling
        if: always()
        working-directory: hardening
        run: |
          pnpm install --frozen-lockfile --filter sechard
          pnpm run build

      - name: download the run artifacts
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hardening-release-run
          path: ${{ runner.temp }}/hardening-artifact

      - name: re-run the gate against the uploaded evidence
        if: always()
        working-directory: hardening
        env:
          APP_ROOT: ${{ github.workspace }}/app/${{ inputs.app_root }}
        run: |
          set -eu
          RUN_DIR="$RUNNER_TEMP/hardening-artifact"
          if [ ! -f "$RUN_DIR/plan.json" ] || [ ! -f "$RUN_DIR/results.json" ]; then
            echo "hardening-gate: plan.json or results.json is missing from the artifact; refusing to report success"
            exit 1
          fi
          pnpm exec hardening gate --app "$APP_ROOT" --policy . --run "$RUN_DIR"
