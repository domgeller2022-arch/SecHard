  status: verified
  packages:
    - name: ajv
      version: 8.20.0
      licence: MIT
      use: "JSON Schema draft 2020-12 via Ajv2020"
    - name: ajv-formats
      version: 3.0.1
      licence: MIT
      use: "Ajv format keywords"
    - name: yaml
      version: 2.9.1
      licence: ISC
      use: "Bounded YAML parsing with duplicate-key, tag, and alias control"
    - name: typescript
      version: 7.0.2
      licence: Apache-2.0
      use: "Strict type checking and build"
    - name: vitest
      version: 5.0.2
      licence: MIT
      use: "Test runner"
    - name: vite
      version: 8.3.1
      licence: MIT
