schema: hardening/toolchain/v1

# Reviewed toolchain. Exact versions, identities, licences, and how each was verified.
# Verified on: 2026-10-06
# Verified by: Step 00 preflight (npm registry metadata)
#
# Status values:
#   verified       version, identity, and licence checked against a primary source
#   planned        selection intent only; verified when the step that needs it begins
#   blocked        cannot be selected until an owner decision or environment fix

runtime:
  status: verified
  node:
    major: 24
    codename: Krypton
    tested_patch: 24.21.0
    lts_start: 2025-10-28
    maintenance_start: 2026-10-20
    end_of_life: 2028-04-30
    source: https://raw.githubusercontent.com/nodejs/Release/main/schedule.json
    cross_check: https://nodejs.org/dist/index.json
  supported_runtime_installed:
    version: 24.21.0
    path: ~/.local/opt/node-v24.21.0/bin/node
    installed_at: "2026-10-06"
    method: official tarball, SHA-256 verified against nodejs.org/dist/v24.21.0/SHASUMS256.txt
    tarball_sha256: 1462cb3b3046b815cf8ea436d3da450ec1a9f11dac7e5a46b0ada5305d7e8097
    note: >-
      Installed under agent_may_install_runtimes: true. Verification results for this repository
      were produced with this runtime. The host also carries Node v25.8.2, which is outside the
      supported line and is no longer used for verification.

package_manager:
  status: verified
  name: pnpm
  version: 12.9.1
  licence: MIT
  source: https://registry.npmjs.org/pnpm
  install_mode: frozen_lockfile
  installed_on_host: true
  settings_location: pnpm-workspace.yaml
  settings_note: >-
    pnpm 12 no longer reads pnpm settings from .npmrc. `minimumReleaseAge` in .npmrc (kebab or
    camel) was ignored and the setting only took effect from pnpm-workspace.yaml. `engine-strict`
    in .npmrc was likewise ignored while `engineStrict` in pnpm-workspace.yaml was enforced.
    `.npmrc` is retained only for a stray npm invocation.
  verified_behaviours:
    - setting: minimumReleaseAge
      value: 10080
      observed: >-
        Refused nanoid@6.0.2 (published 18.5h earlier) with ERR_PNPM_NO_MATURE_MATCHING_VERSION,
        naming the publish time and cutoff, exit 1. Units are minutes. Confirmed enforced.
    - setting: allowBuilds
      value: "{}"
      observed: >-
        Default deny. An unapproved install script failed the install with ERR_PNPM_IGNORED_BUILDS
        and did not run (verified with core-js@3.37.1 and a local tarball fixture). `pkg: true` ran
        the reviewed hook; `pkg: false` recorded a denial without running it.
    - setting: engineStrict
      value: "true"
      observed: ERR_PNPM_UNSUPPORTED_ENGINE under Node 25 against engines >=24 <25; accepted Node 24.21.0.
    - setting: saveExact
      value: "true"
      observed: Exact versions saved rather than caret ranges.
    - setting: strictPeerDependencies
      value: "true"
      observed: >-
        Failed the install with ERR_PNPM_PEER_DEP_ISSUES when vitest's peer vite was not declared.
        vite was added explicitly rather than relaxing the setting.
    - setting: supply_chain_lockfile_check
      observed: >-
        `pnpm install --frozen-lockfile` reports "Lockfile passes supply-chain policies" by default.
        The --trust-lockfile flag skips that verification and is not used.

