schema: hardening/toolchain/v1

# Reviewed toolchain. Exact versions, identities, licences, and how each was verified.
# Verified on: 2026-10-06
# Verified by: Step 00 preflight (npm registry metadata)
#
# Status values:
#   verified       version, identity, and licence checked against a primary source
#   planned        selection intent only; verified when the step that needs it begins
#   blocked        cannot be selected until an owner decision or environment fix

