integrity:
  method: registry_dist_integrity
  detail: >-
    The package manager verifies each package's registry-published dist.integrity (sha512) on
    install and the lockfile records it. Per-dependency digest pinning of the whole transitive
    graph is Step 06 work (policy/dependency-policy.yaml) and is not claimed here.

# Execution identities.
#
# A tool may only run when its identity can be established: an absolute executable path, a recorded
# version, and (where the tool is fetched rather than provided by the platform) a digest that was
# verified. `status: planned` means the identity has not been selected or verified, so the registry
# refuses to run it. Refusing is the correct outcome; inventing a digest would not be.
execution:
  policy: policy/dependency-policy.yaml
  require_absolute_path: true
  require_recorded_version: true
  require_digest_when_fetched: true
  default_timeout_ms: 600000
  default_max_output_bytes: 8388608
  environment: allowlist
  notes: >-
    Tools are launched with an argument array and no shell, from an explicit working directory, with
    an environment built from an allowlist. Output is bounded and the process is terminated on
    deadline.

security_tools:
  status: partially_verified
  note: >-
    `identity: unverified` means the runner refuses to execute the tool: refusing is the correct
    outcome when identity cannot be established, and inventing a digest would not be. The four
    scanners below were fetched on 2026-10-06 through the reviewed download path (approved origin,
    approved redirect host, bounded size, SHA-256 verified) and their versions were confirmed by
    running them. ZAP and testssl remain unverified and their steps remain blocked.
  gitleaks: { step: 9, identity: verified, purpose: "Repository and history secret detection" }
  opengrep: { step: 9, identity: verified, purpose: "Static analysis for the reference stack" }
  osv_scanner: { step: 9, identity: verified, purpose: "Dependency advisories" }
  zizmor: { step: 9, identity: verified, purpose: "GitHub workflow analysis" }
  zap_baseline: { step: 11, identity: unverified, purpose: "Passive live scan", requires_docker: true }
  testssl: { step: 11, identity: unverified, purpose: "Separate TLS verification" }

# Verified executable identities, generated by tools/fetch-tools.mjs.
#
# `expectedVersion` was observed by running the binary, not copied from a release page. `digest` is
# the SHA-256 of the **executable on disk**, checked before every execution, so a substituted binary
# is refused. The digest of the downloaded archive is recorded separately as `archiveSha256`: those
# are different files and recording the archive digest as the executable digest was a real defect
# caught by the registry's own check.
#
# Provenance differs and is stated per tool: gitleaks and osv-scanner have publisher checksums files
# that were cross-checked against the hosting API's release-asset digest; opengrep and zizmor have no
# checksums file, so the release-asset digest is the only recorded source. That is weaker provenance
# and is not described as equivalent. opengrep also ships a cosign `.sig`/`.cert` pair that has not
# been verified here; verifying it is future work.
# Container runtime for the local reference stack (Step 07) and the guarded ZAP adapter (Step 11).
#
# colima and lima are used instead of Docker Desktop: they are MIT and Apache-2.0 respectively, so no
# proprietary licence decision is imposed on the owner. The docker CLI is the Apache-2.0 client only;
# the daemon runs inside the colima VM. Installed with Homebrew, which verifies bottle checksums.
#
# Verification on 2026-10-07: `docker info` reported server 29.5.2 (overlayfs, cgroup v2) and
# `docker run --rm hello-world` completed successfully.
#
# Repair applied: `~/.docker/config.json` carried `credsStore: "desktop"` left over from a removed
# Docker Desktop installation, which broke every image pull. The stale key was removed after backing
# the file up beside it (`config.json.bak-20261008021956`); `auths` was empty, so no credential was
# affected. The owner may prefer to re-add a credential helper of their choosing.
container_runtime:
  status: verified
  name: colima
  version: 0.10.3
  licence: MIT
  daemon_version: "29.5.2"
  components:
    lima: { version: 2.2.1, licence: Apache-2.0 }
    docker_cli: { version: 29.8.2, licence: Apache-2.0 }
  installed_via: Homebrew (bottle checksums verified by the package manager)
  verified_by: docker info and docker run --rm hello-world
  persistence_note: >-
    colima was started manually for this session. For it to survive a reboot, the owner can run
    `brew services start colima`; that is an operator choice, not required by this repository.

executables:
  # Platform-provided tool. Recorded with an absolute path so source-identity resolution never
  # performs a PATH lookup, which Step 06's execution rule forbids. No digest is recorded: an OS
  # update replaces this binary and a stale digest would fail every run. `fetched: false` means the
  # registry does not require one.
  git:
    name: git
    executable: "/usr/local/bin/git"
    fallbackExecutable: "/usr/bin/git"
    versionArgs: ["--version"]
    expectedVersion: "2.55.0"
    fetched: false
    identity: verified
    source: "platform-provided"
    licence: GPL-2.0-only
    provenance: "platform tool, not fetched by this repository"
  gitleaks:
