# Reviewed local rule pack for the reference stack.
#
# Rules are pinned here rather than fetched from a registry at scan time: a rule pack that changes
# under the runner is an unreviewed input. Local, reviewed rules also make the fixture coverage
# meaningful, because each rule below has a matching vulnerable and fixed fixture.
#
# Scope limits, stated rather than implied: these rules are syntactic. They do not perform
# inter-file analysis, and they do not establish authorization. They are review candidates, and a
# match is a finding to triage, not proof of exploitability.
rules:
  - id: hardening.no-eval
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      eval() executes its argument as code. If any part of that value can be influenced by a user,
      it is a code-execution path. Use a parser (for example JSON.parse) instead.
    metadata:
      hardening_controls: [WEB-01, CODE-01]
    pattern: eval(...)

  - id: hardening.child-process-exec-interpolation
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A child process started with exec() receives a shell command string. Building that string
      from a value lets the value become shell syntax. Use execFile with an argument array.
    metadata:
      hardening_controls: [WEB-01, CODE-01, ABUSE-01]
    patterns:
      - pattern: $EXEC(...)
      - metavariable-regex:
          metavariable: $EXEC
          regex: ^(exec|execSync)$

  - id: hardening.dom-innerhtml-assignment
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Assigning to innerHTML parses the value as HTML. Assigning user-influenced text this way is a
      cross-site scripting path. Use textContent, or sanitize with a reviewed library.
    metadata:
      hardening_controls: [WEB-01, CODE-01]
    pattern: $ELEMENT.innerHTML = $VALUE

  # --- Batch S rules: API Top 10 (API7 SSRF, API10 unsafe consumption), RFC 9700 (implicit
  # grant), and the MASVS/Electron first step. ASCII-only: the pinned opengrep reads local
  # rule packs with a locale-dependent codec (recorded in the Batch Q checkpoint).

  - id: hardening.api-unvalidated-response-consumption
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      An external response is returned to the caller as parsed data without any visible status or
      shape validation. A failed or hostile third-party API response should never flow straight
      back into application state or rendering. Check the response status and validate the payload
      shape before returning it. Scope limit, stated: this is the direct-return shape only; a
      response that is parsed into a variable and returned later is not caught in this build.
    metadata:
      hardening_controls: [WEB-01, CODE-01]
    pattern-either:
      - pattern: return await $X.json()
      - pattern: return $X.json()

  - id: hardening.oauth-implicit-grant
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      An implicit-grant response type hands tokens directly to the browser, where history, logs,
      and any script can read them. RFC 9700 prohibits it: use the authorization code flow with
      PKCE, where tokens stay on the server side.
    metadata:
      hardening_controls: [AUTH-03]
    patterns:
      - pattern-either:
          - pattern: |
              {..., response_type: $V, ...}
          - pattern: $X.response_type = $V
      - metavariable-regex:
          metavariable: $V
          regex: ^['\"]?(token|id_token)['\"]?$

  - id: hardening.electron-node-integration
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Electron nodeIntegration:true exposes Node APIs (filesystem, processes) to renderer code.
      With any XSS in the renderer this is remote code execution on the user's machine. Keep
      nodeIntegration off and use a preload script that exposes reviewed IPC instead.
    metadata:
      hardening_controls: [CODE-01, WEB-01]
    pattern-either:
      - pattern: '{nodeIntegration: true}'
      - pattern: $X.nodeIntegration = true

  - id: hardening.electron-context-isolation-off
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Electron contextIsolation:false shares the JavaScript context between the page and preload
      scripts, so page code can reach privileged objects. Isolation must stay on.
    metadata:
      hardening_controls: [CODE-01, WEB-01]
    pattern-either:
      - pattern: '{contextIsolation: false}'
      - pattern: $X.contextIsolation = false

  - id: hardening.electron-sandbox-off
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Electron sandbox:false runs the renderer without the OS sandbox. Unless a preload genuinely
      needs Node, leave the sandbox on; document the exception if one is required.
    metadata:
      hardening_controls: [CODE-01, WEB-01]
    pattern-either:
      - pattern: '{sandbox: false}'
      - pattern: $X.sandbox = false
