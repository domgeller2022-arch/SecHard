    title: "Four real analyzers, execution-safe configuration — F-07"
    state: done
    note: "The four staged quality analysers are real tools run for real from the isolated tools/quality package (its committed lockfile pins jscpd 5.4.1, knip 6.41.0, dependency-cruiser 17.0.1 — pinned at 17.0.1 because 18.x refuses this runner's Node and 16.x crashes on it; allowBuilds {} via onlyBuiltDependencies []; frozen-install route), with Lizard 1.24.1 from a private virtual environment. SecHard-owned configurations live in ci/configs/quality/ (jscpd clone thresholds calibrated on the corpus; Knip with every config-loading plugin disabled and SecHard's own entry declarations — no target JS/TS config import via jiti; dependency-cruiser static JSON rules for cycles and UI-to-database/server-only imports matched against raw import specifiers in both the alias and relative-upward forms — the target's webpack/JS configuration is never loaded). Four recipe handlers (quality/duplication, quality/complexity, quality/dead-code, quality/module-structure) run the tools via the process layer and parse their real outputs; a missing tool is an explicit unsupported (P4.1: provisioning is separate from checking), an application with no applicable sources or no package manifest is an explicit unsupported rather than an error (the Python-only and FastAPI fixture audits carry the four staged checks as could-not-check), and a tool crash is an error with the diagnostic, never an empty success (plan item 6). Observed 2026-10-16: the four corpus positives fire through the compiled CLI — duplication 1 clone (formatPrice/legacyFormatter, 11 files, 3.3%), complexity 19 functions with computeScore at CCN 10 flagged (the Q19 calibration: at-or-above the reviewed threshold 10), dead code 12 findings over 5 files (unused left-pad dependency, dead utils/format.ts file), module structure the UI data-access violation at app/dashboard/page.tsx — quality 17/36 to 22/36 in the corpus, exactly the five staged seeds (Q03/Q04/Q05/Q19/Q27) flipping fired-false-to-true, nothing else. tests/scanner