    note: "A-17: python-web plans static analysis — static_analysis required at pr/release in profiles/python-web.yaml (description and support constraints name the supported families: SQL injection, SSRF, path traversal, cookie attributes from the detection-depth pack; framework secret handling, template injection, Bandit/Ruff stay recorded gaps), OPENGREP_SOURCE_EXTENSIONS gains .py, and the obsolete 'does not support Python' banner in detect.ts now states the supported families. The intended static-analysis scope is pack-relative: a pack's rules declare their languages, so a file outside them cannot be an unexamined gap for that pack (core and quality packs are JavaScript/TypeScript only; detection-depth declares python) — an empty language scope is an explicit unsupported with the reason, and the runOpengrep aggregation refinement keeps an empty-language-scope sibling from masking a passing sibling's real findings (the P3.1 findings-carrying and error rules unchanged). A-32/F-09: detection reads executable evidence — dev-only Vite/Vitest no longer classifies anything as a browser SPA (a production browser-framework dependency, or Vite plus a shipped index.html, is required; SecHard itself now detects as unknown with the unsupported-stack gap instead of react-spa+payments), payment evidence requires executable shapes (line-start SDK import, production payments dependency, quoted event-name string literals — the event-type check requires quoting and the loose 'mentions stripe AND webhook' text check is deleted, which had matched SecHard's own adapter, matcher definition, and explanation prose). Plan item 5: quick/standard/deep recipe selection is one registry table (DEPTH_RECIPE_SELECTION in commands/audit.ts) — quick skips history/browser-output/live-HTTP each reported with its reason, deep runs the same set as standard and the report states that honestly (additional deep behaviour requires reviewed safe-execution preconditions, never a silent alias). The AI-evid