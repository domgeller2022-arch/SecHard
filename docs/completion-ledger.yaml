a download executes, verifies its digest, and writes the artifact; a digest-mismatched download stops the plan and writes nothing; missing-registry/missing-url/missing-destination blocks) — execution suite 79/79; fast suite 610/610; lint and build clean; scanners 76/76; preflight 181 open. See docs/evidence/p4-1-provisioning-execution.md"
