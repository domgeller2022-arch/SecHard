    title: "Finish remaining quality capabilities — QUAL-02/08/10/11/12/13"
    state: done
    note: "QUAL-02: the strict type probe (analyzeStrictTypes in src/quality/correctness.ts) runs tsc (typescript 7.0.2 from the isolated tools/quality package) with SecHard's own strict configuration (ci/configs/quality/tsconfig.strict.json) against the application's type graph — the app's tsconfig is read as data (paths preserved and rewritten relative to the temporary merged configuration because tsc 7 has removed baseUrl), the merged configuration is written to a private temp directory, module-resolution diagnostics (missing type dependencies, an absent tsconfig/node_modules, non-JSON tsconfig) are coverage gaps never findings, and the handler merges the marker/any counts with the probe findings and records the coverage state. QUAL-08: unchanged by design — coverage ratios and mutation scores need an isolated executed suite (P5.1); the gap stays named in the control note. QUAL-10: the quality/formatting recipe is wired — Biome 2.5.15 check-only with SecHard's own configuration via --config-path (the target's biome.json is never discovered) and Ruff 0.17.1 format --check from the private venv with SecHard's own ruff.toml for Python sources; neither tool writes, naming signals stay in vibe-tells. QUAL-11: two hygiene additions — committed generated artifacts (dist/.next/build/out on disk and not covered by the target's .gitignore) and licence-description accuracy (a README claiming an open-source licence without a committed LICENSE file; an owner's private/no-licence choice is described accurately). QUAL-12: analyzeRegistryHealth — bounded reviewed queries (at most 60 packages per audit) against the approved npm registry flagging deprecation, major drift of two or more majors, and staleness beyond 24 months; offline or failed queries are unknown, never healthy; non-npm lockfiles name their ecosystem gap; never replaces OSV. QUAL-13: the quality/frontend-quality handler is wired with its precondition named precisely (an approved running target and browser, which P8 supplies) — a precondition gap, not an unimplemented handler. Provisioning: typescript 7.0.2 and @biomejs/biome 2.5.15 joined the isolated package, ruff 0.17.1 joined the venv, and the venv's requirements.txt now pins every package by wheel hash (the P4.1 item-4 completion); the lint walk skips the provisioned venv. Observed 2026-10-17: tests/scanners/staged-quality.test.ts 18/18 — the strict probe (a genuine strict error flagged at broken.ts:1 with the tree byte-identical; coverage gaps for a missing type graph and a missing tsconfig), formatting (Biome and Ruff positives, a formatted-file negative, check-only proven by the tree digest), the hygiene additions (committed generated artifacts and the licence mismatch flagged; a gitignored dist not flagged), registry health (major drift and deprecation flagged from stubbed registry documents; offline queries unknown; a non-npm lockfile never queried; the query bound recorded), and the frontend precondition unsupported with the P8 reason. Two real toolchain facts discovered and handled: tsc 7 has removed baseUrl (the app's paths are rewritten relative to the temporary merged configuration) and under the stripped child environment tsc 7 writes its diagnostics to stderr (both streams parsed); the strict-probe diagnostic paths are normalized through realpath and matched against the scanned files because macOS temp-dir symlinks report /private/var while the walk used /var. Fast suite 610/610; lint clean (the provisioned venv skipped); build clean; the corpus regenerated security 31/38 + quality 22/36 with ZERO seed changes (the 3-line diff is metadata only — no seed pins the new capabilities, and the corpus application has no node_modules so the strict probe records a coverage gap); the five control notes (QUAL-02/10/11/12/13) updated to the wired reality. See docs/evidence/p4-3-quality-capabilities.md"
    evidence:
