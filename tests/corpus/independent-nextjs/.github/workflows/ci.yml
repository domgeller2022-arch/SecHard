name: ci
on: pull_request_target
permissions: write-all
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: build
        run: echo "title ${{ github.event.pull_request.title }}"
        env:
          TOKEN: ${{ secrets.CI_TOKEN }}
