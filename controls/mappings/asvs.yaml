schema: hardening/standard-mapping/v1
standard_id: owasp-asvs
edition: "5.0.0"
source_data: controls/mappings/data/asvs-5.0.0-en.csv
#
# Requirement-level mapping (remediation-plan Batch S1/S2). Facts (IDs, levels, chapter names)
# are imported from the official v5.0.0 CSV, vendored at source_data under CC BY-SA 4.0 with the
# licence notice in upstream/sources.yaml. The summaries are SecHard's own paraphrases, written for
# this mapping - the standard's text is not reproduced here.
#
# The rule from the review stands: every relationship is related_risk. Nothing is
# verified_coverage until an application is actually assessed against the requirement.
#
# method semantics: automated = a wired recipe checks (a slice of) the requirement;
# manual = a declared manual recipe accepts a validated operator attestation; gap = no coverage in
# this build, with the reason recorded; not_applicable = applies only outside the v1 profiles.
relationship: related_risk
reviewed_by: mapping-agent (owner review pending)
reviewed_at: "2026-10-10T00:00:00Z"
