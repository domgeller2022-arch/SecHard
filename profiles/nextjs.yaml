schema_version: profile/v1
id: nextjs
definition_version: 1
review_status: draft
title: Next.js application (composable stack profile)
extends: [core]
description: >-
  The composable Next.js stack profile. Selects the full feature-gated catalogue; the manifest's
  feature declarations and applicability rules scope it, and the stage method list decides what
  actually runs. Compose with the supabase profile when Supabase is detected. The nextjs-supabase
  profile remains for the reference application's own records.
controls:
  - { control: CTX-01 }
  - { control: GOV-01 }
  - { control: GOV-02 }
  - { control: AGT-01 }
  - { control: AGT-02 }
  - { control: AGT-03 }
  - { control: DEP-01 }
  - { control: DEP-02 }
  - { control: DEP-03 }
  - { control: SEC-01 }
  - { control: SEC-02 }
  - { control: SEC-03 }
  - { control: CI-01 }
  - { control: CI-02 }
  - { control: CI-03 }
  - { control: CODE-01 }
  - { control: QUAL-01 }
  - { control: AUTH-01 }
  - { control: AUTH-02 }
  - { control: AUTH-03 }
  - { control: AUTHZ-01 }
  - { control: AUTHZ-02 }
  - { control: AUTHZ-03 }
  - { control: DATA-01 }
  - { control: WEB-01 }
  - { control: WEB-02 }
  - { control: ABUSE-01 }
  - { control: BIZ-01 }
  - { control: DEPLOY-01 }
  - { control: OPS-01 }
  - { control: OPS-02 }
  - { control: OPS-03 }
  - { control: PRIV-01 }
  - { control: REL-01 }
  - { control: REL-02 }
  - { control: EXC-01 }
excluded_features:
  - payments
  - webhooks
  - uploads
  - tenancy
  - runtime_ai
stage_requirements:
  pr:
    required_methods:
      - schema_validation
      - policy_consistency
      - secret_scan
      - dependency_scan
      - static_analysis
      - workflow_analysis
      - build_check
      - client_asset_inspection
      - live_http_check
  release:
    required_methods:
      - schema_validation
      - policy_consistency
      - secret_scan
      - dependency_scan
      - static_analysis
      - workflow_analysis
      - build_check
      - client_asset_inspection
      - live_http_check
      - tls_check
      - manual_attestation
    require_clean_source: true
    require_actual_tool_origin: true
  operations:
    required_methods:
      - policy_consistency
      - dependency_scan
      - manual_attestation
    require_actual_tool_origin: false

support_constraints:
  platforms: [linux-ci]
  notes: >-
    Client-asset inspection and live HTTP checks are required at PR depth for this stack, not only at
    release: a leaking client bundle or missing transport headers is cheaper to catch before merge.
permitted_exceptions:
  - { control: CTX-01, policy: permitted, max_duration_days: 90 }
  - { control: GOV-01, policy: permitted, max_duration_days: 30 }
  - { control: GOV-02, policy: never }
  - { control: AGT-01, policy: permitted, max_duration_days: 30 }
  - { control: AGT-02, policy: permitted, max_duration_days: 90 }
  - { control: AGT-03, policy: never }
  - { control: DEP-01, policy: permitted, max_duration_days: 14 }
  - { control: DEP-02, policy: permitted, max_duration_days: 90 }
  - { control: DEP-03, policy: permitted, max_duration_days: 30 }
  - { control: SEC-01, policy: permitted, max_duration_days: 14 }
  - { control: SEC-02, policy: permitted, max_duration_days: 7 }
  - { control: SEC-03, policy: permitted, max_duration_days: 30 }
  - { control: CI-01, policy: never }
  - { control: CI-02, policy: permitted, max_duration_days: 30 }
  - { control: CI-03, policy: never }
  - { control: CODE-01, policy: permitted, max_duration_days: 90 }
  - { control: QUAL-01, policy: permitted, max_duration_days: 30 }
  - { control: AUTH-01, policy: never }
  - { control: AUTH-02, policy: permitted, max_duration_days: 30 }
  - { control: AUTH-03, policy: never, note: "A broken authorization flow needs containment and remediation" }
  - { control: AUTHZ-01, policy: never }
  - { control: AUTHZ-02, policy: never }
  - { control: AUTHZ-03, policy: never }
  - { control: DATA-01, policy: permitted, max_duration_days: 14 }
  - { control: WEB-01, policy: permitted, max_duration_days: 60 }
  - { control: WEB-02, policy: permitted, max_duration_days: 30 }
  - { control: ABUSE-01, policy: permitted, max_duration_days: 60 }
  - { control: BIZ-01, policy: permitted, max_duration_days: 30 }
  - { control: DEPLOY-01, policy: permitted, max_duration_days: 30 }
  - { control: OPS-01, policy: permitted, max_duration_days: 30 }
  - { control: OPS-02, policy: permitted, max_duration_days: 90 }
  - { control: OPS-03, policy: permitted, max_duration_days: 90 }
  - { control: PRIV-01, policy: permitted, max_duration_days: 90 }
  - { control: REL-01, policy: never }
  - { control: REL-02, policy: permitted, max_duration_days: 90 }
  - { control: EXC-01, policy: never }

