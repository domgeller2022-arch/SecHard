schema_version: profile/v1
id: python-web
definition_version: 1
review_status: draft
title: Python web application (composable stack profile)
extends: [core]
description: >-
  A Flask/FastAPI/Django application. Static analysis is required for the reviewed Python rule
  families (P3.5, A-17): the detection-depth pack plans SQL-injection, SSRF, path-traversal and
  cookie-attribute checks over Python sources. Framework-specific secret handling, template
  injection, and the Bandit/Ruff expansion remain recorded gaps, not silently skipped coverage.
controls:
  - { control: CTX-01 }
  - { control: GOV-01 }
  - { control: GOV-02 }
  - { control: AGT-01 }
  - { control: AGT-02 }
  - { control: AGT-03 }
  - { control: DEP-01 }
  - { control: DEP-02 }
  - { control: DEP-03 }
  - { control: SEC-01 }
  - { control: SEC-02 }
  - { control: SEC-03 }
  - { control: CI-01 }
  - { control: CI-02 }
  - { control: CI-03 }
  - { control: CODE-01 }
  - { control: QUAL-01 }
  - { control: AUTH-01 }
  - { control: AUTH-02 }
  - { control: AUTHZ-01 }
  - { control: AUTHZ-02 }
  - { control: AUTHZ-03 }
  - { control: DATA-01 }
  - { control: WEB-01 }
  - { control: WEB-02 }
  - { control: ABUSE-01 }
  - { control: BIZ-01 }
  - { control: DEPLOY-01 }
  - { control: OPS-01 }
  - { control: OPS-02 }
  - { control: OPS-03 }
  - { control: PRIV-01 }
  - { control: REL-01 }
  - { control: REL-02 }
  - { control: EXC-01 }
excluded_features:
  - payments
  - webhooks
  - uploads
  - tenancy
  - runtime_ai
stage_requirements:
  pr:
    required_methods:
      - schema_validation
      - policy_consistency
      - secret_scan
      - dependency_scan
      - static_analysis
      - workflow_analysis
      - live_http_check
  release:
    required_methods:
      - schema_validation
      - policy_consistency
      - secret_scan
      - dependency_scan
      - static_analysis
      - workflow_analysis
      - live_http_check
      - tls_check
      - manual_attestation
    require_clean_source: true
    require_actual_tool_origin: true
  operations:
    required_methods:
      - policy_consistency
      - dependency_scan
      - manual_attestation
    require_actual_tool_origin: false

support_constraints:
  platforms: [linux-ci]
  notes: >-
    Dependency scanning covers requirements.txt. Static analysis covers the reviewed Python rule
    families in the detection-depth pack (SQL injection, SSRF, path traversal, cookie attributes,
    planned per A-17). Framework-specific secret handling, template-injection rules, and the
    Bandit/Ruff expansion are expansion-batch work and are recorded as gaps, not silently skipped.
