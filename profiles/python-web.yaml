schema_version: profile/v1
id: python-web
definition_version: 1
review_status: draft
title: Python web application (composable stack profile)
extends: [core]
description: >-
  A Flask/FastAPI/Django application. Static analysis is deliberately NOT required by this profile in
  this build: the reviewed Opengrep rule pack is JavaScript/TypeScript only, and requiring a method
  the rule pack cannot honestly serve would produce a fabricated unsupported result presented as
  coverage. Python static analysis arrives with the expansion batch (Bandit/Ruff rules).
controls:
  - { control: CTX-01 }
  - { control: GOV-01 }
  - { control: GOV-02 }
  - { control: AGT-01 }
  - { control: AGT-02 }
  - { control: AGT-03 }
  - { control: DEP-01 }
  - { control: DEP-02 }
  - { control: DEP-03 }
  - { control: SEC-01 }
  - { control: SEC-02 }
  - { control: SEC-03 }
  - { control: CI-01 }
  - { control: CI-02 }
  - { control: CI-03 }
  - { control: CODE-01 }
  - { control: QUAL-01 }
  - { control: AUTH-01 }
  - { control: AUTH-02 }
  - { control: AUTHZ-01 }
  - { control: AUTHZ-02 }
  - { control: AUTHZ-03 }
  - { control: DATA-01 }
  - { control: WEB-01 }
  - { control: WEB-02 }
  - { control: ABUSE-01 }
  - { control: BIZ-01 }
  - { control: DEPLOY-01 }
  - { control: OPS-01 }
  - { control: OPS-02 }
  - { control: OPS-03 }
  - { control: PRIV-01 }
  - { control: REL-01 }
  - { control: REL-02 }
  - { control: EXC-01 }
excluded_features:
  - payments
  - webhooks
  - uploads
  - tenancy
  - runtime_ai
stage_requirements:
  pr:
    required_methods:
      - schema_validation
      - policy_consistency
      - secret_scan
      - dependency_scan
      - workflow_analysis
      - live_http_check
  release:
    required_methods:
      - schema_validation
      - policy_consistency
      - secret_scan
      - dependency_scan
      - workflow_analysis
      - live_http_check
      - tls_check
      - manual_attestation
    require_clean_source: true
    require_actual_tool_origin: true
  operations:
    required_methods:
      - policy_consistency
      - dependency_scan
      - manual_attestation
    require_actual_tool_origin: false

support_constraints:
  platforms: [linux-ci]
  notes: >-
    Dependency scanning covers requirements.txt. Python-specific static analysis, framework secrets
    handling, and template-injection rules are expansion-batch work and are recorded as gaps, not
    silently skipped.
